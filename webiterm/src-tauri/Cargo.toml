[package]
name = "webiterm"
version = "0.1.1"
description = "Local-first developer workstation"
authors = ["WebiTerm"]
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
name = "webiterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
base64 = "0.22.1"
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
ssh2 = "0.9.6"
sqlx = { version = "0.9.0", default-features = false, features = [
    "runtime-tokio",
    "mysql",
    "tls-rustls-ring-native-roots",
] }
tauri = { version = "2.12.3", features = [] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
