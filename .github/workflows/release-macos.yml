name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webiterm/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        working-directory: webiterm
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: webiterm
          tagName: ${{ github.ref_name }}
          releaseName: WebiTerm ${{ github.ref_name }}
          releaseBody: |
            macOS (Apple Silicon) build for ${{ github.ref_name }}.

            Open the `.dmg`, drag WebiTerm to Applications, then launch from Applications.
            If macOS still blocks the app, use **Check for Updates** after installing a signed build, or see [docs/RELEASE.md](https://github.com/Webisso/webiterm/blob/main/docs/RELEASE.md).
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Verify app bundle signature
        run: |
          APP=$(find webiterm/src-tauri/target -path '*/release/bundle/macos/WebiTerm.app' | head -1)
          if [ -z "$APP" ]; then
            echo "WebiTerm.app not found in bundle output"
            exit 1
          fi
          codesign -dv --verbose=2 "$APP" 2>&1 | tee /tmp/codesign.txt
          if grep -q 'Sealed Resources=none' /tmp/codesign.txt; then
            echo "Bundle is not properly sealed — DMG may show as damaged."
            exit 1
          fi
